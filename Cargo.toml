[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/stef-al/ramlord"

[workspace.dependencies]
ramlord-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
